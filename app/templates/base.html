<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Registro Horario de Producción{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Registro Horario · Producción</span>
      <nav>
        <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Formulario</a>
        <a href="{{ url_for('main.lineas') }}" class="{{ 'active' if request.endpoint == 'main.lineas' }}">Ver líneas pendientes</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="user">{{ user.display_name }}{% if user.role %} · {{ user.role }}{% endif %}</span>
      <a href="{{ url_for('main.logout') }}" class="btn btn-ghost">Cerrar sesión</a>
    </div>
  </header>
  {% endif %}

  <main class="content">
    <div id="flash" class="flash" hidden></div>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
